[project]
name = "vectorforge"
version = "0.1.0"
description = "A retrieval engine to study exact vs approximate vs hybrid retrieval trade-offs."
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "^0.95.0"
uvicorn = "^0.22.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"
hnswlib = "^0.7.0"
pytest = "^8.0"

[project.scripts]
vectorforge = "vectorforge.cli:main"
